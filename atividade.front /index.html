<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f6f8;
            color: #1f2937;
        }

        h1 {
            margin-bottom: 8px;
        }

        .orientacao {
            margin-bottom: 24px;
            color: #4b5563;
        }

        .painel {
            margin-bottom: 24px;
            padding: 24px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            background: white;
        }

        #area-mouse {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 180px;
            border: 3px dashed #2563eb;
            border-radius: 10px;
            background: #eff6ff;
            text-align: center;
            cursor: pointer;
            user-select: none;
        }

        #area-mouse.ponteiro-dentro {
            background: #dcfce7;
            border-color: #16a34a;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 2px solid #94a3b8;
            border-radius: 8px;
            font-size: 18px;
        }
      #botao {
            margin-top: 12px;
            padding: 12px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        #botao:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>
    <div class="painel">
        <h1>Atividade — Eventos de Mouse e Teclado</h1>
        <p class="orientacao">Digite seu nome no campo abaixo e pressione Enter ou clique no botão "Enviar".</p>        
    <form>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        <button  id="botao" type="submit">Enviar</button>
    </form>
    </div>
    <p id="mensagem"></p>
    <script>
        const form = document.querySelector('form');
        const inputNome = document.getElementById('nome');
        const mensagem = document.getElementById('mensagem');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Evita o envio do formulário
            const nome = inputNome.value.trim();
            if (nome) {
                mensagem.textContent = `Olá, ${nome}!`;
            } else {
                mensagem.textContent = 'Por favor, digite seu nome.';
            }
        });

   </script>
       
</body>
</html>
